<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Portal — Demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <div class="badge">DEMONSTRATION RESULT</div>
    <h1>Login submitted</h1>
    <p class="sub">These values were intentionally sent over HTTP.</p>

    <div class="result">
      <div><span>Username</span><code>{{ username }}</code></div>
      <div><span>Password</span><code>{{ password }}</code></div>
    </div>

    <a class="back" href="/">← Back to login</a>
  </div>
</body>
</html>
