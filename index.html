<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Portal — Cyber Awareness Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="logo">CP</div>
        <div>
          <h1>Campus Portal</h1>
          <p>Cyber Awareness Demonstration</p>
        </div>
      </div>

      <div class="warning">
        <strong>TRAINING DEMO</strong>
        <span>Use only the fake credentials shown below.</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          value="demo_student"
          placeholder="Enter username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="text"
          value="CyberDemo123"
          placeholder="Enter password"
          required
        >

        <button type="submit">Sign in</button>
      </form>

      <div id="result" class="result hidden"></div>

      <div class="demo-note">
        <span class="dot"></span>
        <span>This is a fictional login page created for classroom security training.</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
